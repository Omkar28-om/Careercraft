services:
  - type: web
    name: careercraft-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run db:migrate
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://careercraft-peach.vercel.app
      - key: CORS_ORIGINS
        value: https://careercraft-peach.vercel.app
